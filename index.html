<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Virtual Museum ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b0f;
            color: #fff;
            overflow: hidden;
        }

        /* Top Music Button */
        .music-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* 3D Museum Stage */
        .museum-container {
            perspective: 1000px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1528 0%, #08060a 100%);
            position: relative;
        }

        .room-3d {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            animation: panRoom 15s infinite alternate ease-in-out;
        }

        @keyframes panRoom {
            0% { transform: scale(1) rotateY(0deg); }
            100% { transform: scale(1.05) rotateY(3deg); }
        }

        /* Museum Header */
        .museum-header {
            position: absolute;
            top: 25px;
            text-align: center;
            z-index: 10;
        }

        .museum-header h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #ffb3c1;
            margin-bottom: 4px;
        }

        .museum-header p {
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        /* 3D Gallery Wall */
        .wall {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            transform: translateZ(-50px);
        }

        .painting-frame {
            background: #1e1e1e;
            padding: 12px 12px 35px 12px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 15px rgba(255, 117, 140, 0.2);
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            transform: rotateY(5deg);
        }

        .painting-frame:nth-child(even) {
            transform: rotateY(-5deg);
        }

        .painting-frame:hover {
            transform: scale(1.1) rotateY(0deg) translateZ(30px);
            box-shadow: 0 20px 45px rgba(255, 117, 140, 0.4);
            z-index: 20;
        }

        .painting-frame img {
            width: 180px;
            height: 230px;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        .painting-frame span {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #ccc;
        }

        /* Interactive Footer & Avatar Action */
        .museum-footer {
            position: absolute;
            bottom: 30px;
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        .action-btn {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
            transition: 0.3s;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        /* Modal Popup */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #161220;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 12px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        .modal-content img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .modal-content p {
            color: #ffcad4;
            font-size: 0.95rem;
        }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 1.3rem;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button class="music-btn" onclick="toggleMusic()">🎵 Play Music</button>
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="museum-container">
        <!-- Museum Header Title -->
        <div class="museum-header">
            <h1>OUR VIRTUAL MUSEUM</h1>
            <p>From Saron To Biddya ❤️</p>
        </div>

        <!-- 3D Room & Wall With Frames -->
        <div class="room-3d">
            <div class="wall">
                <div class="painting-frame" onclick="openPhoto('https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500', 'আমাদের সুন্দর মুহূর্তগুলো ✨')">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500" alt="Memory 1">
                    <span>Memory 1</span>
                </div>

                <div class="painting-frame" onclick="openPhoto('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500', 'সেরা উপহার ও ভালোবাসা 💖')">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Memory 2">
                    <span>Memory 2</span>
                </div>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="museum-footer">
            <button class="action-btn" onclick="triggerDance()">💃 Dance with me!</button>
        </div>
    </div>

    <!-- Modal Popup -->
    <div id="modal" class="modal" onclick="closePhoto()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closePhoto()">&times;</span>
            <img id="modal-img" src="" alt="Memory">
            <p id="modal-text"></p>
        </div>
    </div>

    <script>
        // Music Play/Pause
        const music = document.getElementById('bg-music');
        const musicBtn = document.querySelector('.music-btn');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = '🎵 Play Music';
            } else {
                music.play();
                musicBtn.innerHTML = '⏸️ Pause Music';
            }
            isPlaying = !isPlaying;
        }

        // Photo Modal
        function openPhoto(src, caption) {
            document.getElementById('modal-img').src = src;
            document.getElementById('modal-text').innerText = caption;
            document.getElementById('modal').style.display = 'flex';
        }

        function closePhoto() {
            document.getElementById('modal').style.display = 'none';
        }

        // Dance Action
        function triggerDance() {
            alert("✨ Avatar is dancing with joy! 💃🕺");
        }
    </script>
</body>
</html>
